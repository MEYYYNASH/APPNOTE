name: Android Release & Package (APPNOTE)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write
  packages: write

jobs:
  build-sign-release:
    name: Build, Sign, Verify & Publish APK to GitHub Releases & Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses & Ensure Platform 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-36.1" "build-tools;36.0.0" || true
          fi

      - name: Restore Official APPNOTE Signing Keystore (8b259701...)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OFFICIAL_DEBUG_KEYSTORE_B64: ""
        run: |
          echo "$OFFICIAL_DEBUG_KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > "${GITHUB_WORKSPACE}/debug.keystore"
          keytool -list -v -keystore "${GITHUB_WORKSPACE}/debug.keystore" -storepass android -alias androiddebugkey | grep "SHA256:"

      - name: Determine Release Version Tag & VersionCode
        id: version_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v1.2.0"
          fi
          CLEAN_VERSION="${TAG_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CLEAN_VERSION}"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-2}
          PATCH=${PATCH%%[^0-9]*}
          PATCH=${PATCH:-0}
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

          sed -i "s/versionCode = [0-9]\+/versionCode = ${VERSION_CODE}/g" app/build.gradle.kts || true
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${CLEAN_VERSION}\"/g" app/build.gradle.kts || true

          git config user.name "github-actions[bot]" || true
          git config user.email "github-actions[bot]@users.noreply.github.com" || true
          git tag -f "${TAG_NAME}" "${GITHUB_SHA}" || true
          git push origin "refs/tags/${TAG_NAME}" --force || true

      - name: Build & Sign Android APK (v1.2.0 / 10200) with Official Keystore
        run: |
          touch .env .env.example
          # Remove any orphaned merged values.xml left in repo that duplicates colors.xml/strings.xml/themes.xml
          rm -f app/src/main/res/values/values.xml
          mkdir -p .ci-release-artifacts
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
          BUILT_APK=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -n "$BUILT_APK" ] && [ -f "$BUILT_APK" ]; then
            cp "$BUILT_APK" .ci-release-artifacts/app-release.apk
          else
            echo "ERROR: No built APK found."
            exit 1
          fi

          # Align & Verify / Sign with V1 + V2 + V3 signatures using the official debug.keystore (8b259701...)
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=$(ls -d "$SDK_ROOT/build-tools/"* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$BUILD_TOOLS_DIR" ]; then
            if [ -x "$BUILD_TOOLS_DIR/zipalign" ]; then
              "$BUILD_TOOLS_DIR/zipalign" -f -p 4 .ci-release-artifacts/app-release.apk .ci-release-artifacts/app-aligned.apk && mv .ci-release-artifacts/app-aligned.apk .ci-release-artifacts/app-release.apk
            fi
            if [ -x "$BUILD_TOOLS_DIR/apksigner" ]; then
              APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
              "$APKSIGNER" sign \
                --ks "${GITHUB_WORKSPACE}/debug.keystore" \
                --ks-key-alias androiddebugkey \
                --ks-pass pass:android \
                --key-pass pass:android \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                .ci-release-artifacts/app-release.apk
              "$APKSIGNER" verify --verbose --print-certs .ci-release-artifacts/app-release.apk
              CERT_SHA256=$("$APKSIGNER" verify --print-certs .ci-release-artifacts/app-release.apk | grep -m 1 "SHA-256 digest:" | awk '{print $NF}')
              echo "Verified APK Certificate SHA-256: ${CERT_SHA256}"
              echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_ENV"
            fi
            if [ -x "$BUILD_TOOLS_DIR/aapt" ]; then
              "$BUILD_TOOLS_DIR/aapt" dump badging .ci-release-artifacts/app-release.apk | head -n 5 || true
            elif [ -x "$BUILD_TOOLS_DIR/aapt2" ]; then
              "$BUILD_TOOLS_DIR/aapt2" dump badging .ci-release-artifacts/app-release.apk | head -n 5 || true
            fi
          fi
          cp .ci-release-artifacts/app-release.apk .ci-release-artifacts/GlassNotes.apk

      - name: Calculate SHA-256 Checksum & Generate Release Metadata
        id: checksum
        run: |
          SHA256_HASH=$(sha256sum .ci-release-artifacts/app-release.apk | awk '{print $1}')
          echo "${SHA256_HASH}  app-release.apk" > .ci-release-artifacts/app-release.apk.sha256
          echo "sha256=${SHA256_HASH}" >> "$GITHUB_OUTPUT"

          cat <<EOF > .ci-release-artifacts/release-metadata.json
          {
            "repository": "${GITHUB_REPOSITORY}",
            "packageName": "com.aistudio.glassnotes.vqpzxm",
            "tagName": "${{ steps.version_meta.outputs.tag_name }}",
            "versionName": "${{ steps.version_meta.outputs.version_name }}",
            "versionCode": ${{ steps.version_meta.outputs.version_code }},
            "apkFileName": "app-release.apk",
            "sha256": "${SHA256_HASH}",
            "signingCertSha256": "${cert_sha256}",
            "publishedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Publish APK to GitHub Packages (Maven Registry)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          mvn -B deploy:deploy-file \
            -DgroupId=com.aistudio.glassnotes \
            -DartifactId=appnote \
            -Dversion="${{ steps.version_meta.outputs.version_name }}" \
            -Dpackaging=apk \
            -Dfile=.ci-release-artifacts/app-release.apk \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${REPO_LOWER}" || true

      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_meta.outputs.tag_name }}
          name: "APPNOTE ${{ steps.version_meta.outputs.tag_name }}"
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
          body: |
            ## APPNOTE ${{ steps.version_meta.outputs.tag_name }}
            - **Repository:** `${{ github.repository }}`
            - **Package Name:** `com.aistudio.glassnotes.vqpzxm`
            - **Version Name:** `${{ steps.version_meta.outputs.version_name }}`
            - **Version Code:** `${{ steps.version_meta.outputs.version_code }}`
            - **APK Asset:** `app-release.apk` (`GlassNotes.apk`)
            - **SHA-256:** `${{ steps.checksum.outputs.sha256 }}`
            - **Signing Cert SHA-256:** `${{ env.cert_sha256 }}`
          files: |
            .ci-release-artifacts/app-release.apk
            .ci-release-artifacts/GlassNotes.apk
            .ci-release-artifacts/app-release.apk.sha256
            .ci-release-artifacts/release-metadata.json
