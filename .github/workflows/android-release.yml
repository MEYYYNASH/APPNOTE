name: Android Release APK (APPNOTE)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-sign-release:
    name: Build, Sign, Verify & Publish APK to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Signing Keystore (Secrets or Automatic Fallback)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/release-signing-key.jks"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "Using configured GitHub Actions signing secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KS_PASS=${ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${ANDROID_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "KEY_PASS=${ANDROID_KEY_PASSWORD}" >> "$GITHUB_ENV"
          elif [ -f "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            echo "Using repository debug.keystore..."
            cp "${GITHUB_WORKSPACE}/debug.keystore" "$KEYSTORE_FILE"
            echo "KS_PASS=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "KEY_PASS=android" >> "$GITHUB_ENV"
          else
            echo "Generating official APPNOTE signing keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=MEY-NASHH, OU=APPNOTE, O=APPNOTE, L=PhnomPenh, S=PP, C=KH"
            echo "KS_PASS=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"
            echo "KEY_PASS=android" >> "$GITHUB_ENV"
          fi

      - name: Determine Release Version Tag & VersionCode
        id: version_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v1.1.${GITHUB_RUN_NUMBER:-1}"
          fi
          CLEAN_VERSION="${TAG_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CLEAN_VERSION}"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-1}
          PATCH=${PATCH%%[^0-9]*}
          PATCH=${PATCH:-0}
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Build Android APK with Gradle
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Align, Sign & Verify APK with apksigner
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"

          RAW_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "ERROR: Built APK not found."
            exit 1
          fi

          "$ZIPALIGN" -f -v -p 4 "$RAW_APK" app-aligned.apk
          "$APKSIGNER" sign \
            --ks "${GITHUB_WORKSPACE}/release-signing-key.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out app-release.apk \
            app-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs app-release.apk
          CERT_SHA256=$("$APKSIGNER" verify --print-certs app-release.apk | grep -m 1 "SHA-256 digest:" | awk '{print $NF}')
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_ENV"

      - name: Calculate SHA-256 Checksum & Generate Release Metadata
        id: checksum
        run: |
          SHA256_HASH=$(sha256sum app-release.apk | awk '{print $1}')
          echo "${SHA256_HASH}  app-release.apk" > app-release.apk.sha256
          echo "sha256=${SHA256_HASH}" >> "$GITHUB_OUTPUT"

          cat <<EOF > release-metadata.json
          {
            "repository": "MEY-NASHH/APPNOTE",
            "tagName": "${{ steps.version_meta.outputs.tag_name }}",
            "versionName": "${{ steps.version_meta.outputs.version_name }}",
            "versionCode": ${{ steps.version_meta.outputs.version_code }},
            "apkFileName": "app-release.apk",
            "sha256": "${SHA256_HASH}",
            "signingCertSha256": "${cert_sha256}",
            "publishedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Clean Up Temporary Keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/release-signing-key.jks" app-aligned.apk

      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_meta.outputs.tag_name }}
          name: "APPNOTE ${{ steps.version_meta.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## APPNOTE ${{ steps.version_meta.outputs.tag_name }}
            - **Version Name:** `${{ steps.version_meta.outputs.version_name }}`
            - **Version Code:** `${{ steps.version_meta.outputs.version_code }}`
            - **APK Asset:** `app-release.apk`
            - **SHA-256:** `${{ steps.checksum.outputs.sha256 }}`
          files: |
            app-release.apk
            app-release.apk.sha256
            release-metadata.json
