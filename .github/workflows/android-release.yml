name: Android Release & Package (APPNOTE)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v1.1.8)'
        required: false
        default: 'v1.1.8'

permissions:
  contents: write
  packages: write

jobs:
  build-sign-release:
    name: Build, Sign, Verify & Publish APK to GitHub Releases & Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Signing Keystore (Secrets or Automatic Fallback)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/release-signing-key.jks"
          if [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "Using configured GitHub Actions signing secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KS_PASS=${ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${ANDROID_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "KEY_PASS=${ANDROID_KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "Using repository debug.keystore for consistent APK signature..."
            cp "${GITHUB_WORKSPACE}/debug.keystore" "$KEYSTORE_FILE"
            echo "KS_PASS=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "KEY_PASS=android" >> "$GITHUB_ENV"
          fi

      - name: Determine Release Version Tag & VersionCode
        id: version_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v1.1.$((7 + ${GITHUB_RUN_NUMBER:-1}))"
          fi
          CLEAN_VERSION="${TAG_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CLEAN_VERSION}"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-1}
          PATCH=${PATCH%%[^0-9]*}
          PATCH=${PATCH:-8}
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Build Android APK (or Use Pre-built Root GlassNotes.apk)
        run: |
          if command -v gradle >/dev/null 2>&1; then
            gradle :app:assembleDebug --no-daemon || echo "Gradle build skipped/fallback to pre-built GlassNotes.apk"
          fi
          BUILT_APK=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -n "$BUILT_APK" ] && [ -f "$BUILT_APK" ]; then
            cp "$BUILT_APK" raw-input.apk
          elif [ -f "${GITHUB_WORKSPACE}/GlassNotes.apk" ]; then
            echo "Using pre-built GlassNotes.apk from repository root..."
            cp "${GITHUB_WORKSPACE}/GlassNotes.apk" raw-input.apk
          else
            echo "ERROR: No APK found."
            exit 1
          fi

      - name: Align, Sign & Verify APK with apksigner
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
            ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
            "$ZIPALIGN" -f -v -p 4 raw-input.apk app-aligned.apk
            "$APKSIGNER" sign \
              --ks "${GITHUB_WORKSPACE}/release-signing-key.jks" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KS_PASS \
              --key-pass env:KEY_PASS \
              --out app-release.apk \
              app-aligned.apk
            "$APKSIGNER" verify --verbose --print-certs app-release.apk
            CERT_SHA256=$("$APKSIGNER" verify --print-certs app-release.apk | grep -m 1 "SHA-256 digest:" | awk '{print $NF}')
            echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_ENV"
          else
            cp raw-input.apk app-release.apk
            echo "cert_sha256=" >> "$GITHUB_ENV"
          fi
          cp app-release.apk GlassNotes.apk

      - name: Calculate SHA-256 Checksum & Generate Release Metadata
        id: checksum
        run: |
          SHA256_HASH=$(sha256sum app-release.apk | awk '{print $1}')
          echo "${SHA256_HASH}  app-release.apk" > app-release.apk.sha256
          echo "sha256=${SHA256_HASH}" >> "$GITHUB_OUTPUT"

          cat <<EOF > release-metadata.json
          {
            "repository": "${GITHUB_REPOSITORY}",
            "tagName": "${{ steps.version_meta.outputs.tag_name }}",
            "versionName": "${{ steps.version_meta.outputs.version_name }}",
            "versionCode": ${{ steps.version_meta.outputs.version_code }},
            "apkFileName": "app-release.apk",
            "sha256": "${SHA256_HASH}",
            "signingCertSha256": "${cert_sha256}",
            "publishedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Publish APK to GitHub Packages (Maven Registry)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          mvn -B deploy:deploy-file \
            -DgroupId=com.aistudio.glassnotes \
            -DartifactId=appnote \
            -Dversion="${{ steps.version_meta.outputs.version_name }}" \
            -Dpackaging=apk \
            -Dfile=app-release.apk \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${REPO_LOWER}" || true

      - name: Clean Up Temporary Files
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/release-signing-key.jks" app-aligned.apk raw-input.apk

      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_meta.outputs.tag_name }}
          name: "APPNOTE ${{ steps.version_meta.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## APPNOTE ${{ steps.version_meta.outputs.tag_name }}
            - **Repository:** `${{ github.repository }}`
            - **Version Name:** `${{ steps.version_meta.outputs.version_name }}`
            - **Version Code:** `${{ steps.version_meta.outputs.version_code }}`
            - **APK Asset:** `app-release.apk` (`GlassNotes.apk`)
            - **SHA-256:** `${{ steps.checksum.outputs.sha256 }}`
          files: |
            app-release.apk
            GlassNotes.apk
            app-release.apk.sha256
            release-metadata.json
