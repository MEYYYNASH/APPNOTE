<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GlassNotes</title>
<meta name="description" content="A clean glassmorphic mobile-first Notes app with checklists, voice, drawing, scan attachments, version history, and bilingual support.">
<meta property="og:title" content="GlassNotes">
<meta property="og:description" content="A clean glassmorphic mobile-first Notes app with checklists, voice, drawing, scan attachments, version history, and bilingual support.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#cfe3ff;--bg2:#e4d9ff;--glass:rgba(255,255,255,.5);--card:rgba(255,255,255,.55);--edge:rgba(255,255,255,.75);--ink:#0d1b2e;--mute:#52657d;--a1:#2f7cff;--a2:#7a5cff;--field:rgba(255,255,255,.6);--shadow:0 12px 40px rgba(40,70,130,.2);--blob:.5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#050d1c;--bg2:#140b2e;--glass:rgba(18,28,50,.5);--card:rgba(255,255,255,.06);--edge:rgba(255,255,255,.13);--ink:#eaf1ff;--mute:#8fa3bf;--a1:#4da3ff;--a2:#9a7bff;--field:rgba(255,255,255,.07);--shadow:0 12px 40px rgba(0,0,0,.5);--blob:.4;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#050d1c;--bg2:#140b2e;--glass:rgba(18,28,50,.5);--card:rgba(255,255,255,.06);--edge:rgba(255,255,255,.13);--ink:#eaf1ff;--mute:#8fa3bf;--a1:#4da3ff;--a2:#9a7bff;--field:rgba(255,255,255,.07);--shadow:0 12px 40px rgba(0,0,0,.5);--blob:.4;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.bg i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:var(--blob);animation:float 22s ease-in-out infinite alternate}
.bg i:nth-child(1){background:#3b82f6;top:-15%;left:-10%}
.bg i:nth-child(2){background:#8b5cf6;bottom:-20%;right:-10%;animation-delay:-8s}
.bg i:nth-child(3){background:#06b6d4;top:35%;left:35%;width:30vmax;height:30vmax;animation-delay:-14s}
@keyframes float{to{transform:translate(8vmax,-6vmax) scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.app{position:relative;z-index:1;display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr);gap:14px;padding:14px;height:100%}
.pane{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);border:1px solid var(--edge);border-radius:24px;box-shadow:var(--shadow)}
.top{display:flex;align-items:center;gap:10px;padding:18px 18px 8px;min-width:0}
.top h1{flex:1;min-width:0;margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.ib{display:inline-grid;place-items:center;flex:none;width:40px;height:40px;border-radius:50%;background:var(--field);border:1px solid var(--edge);transition:transform .2s,background .25s,color .25s}
.ib:hover{transform:translateY(-2px)}
.ib:active{transform:scale(.9)}
.ib.act{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
.ib.danger:hover{color:#ef4444}
.srch{display:flex;align-items:center;gap:8px;margin:4px 16px 10px;padding:0 14px;height:44px;border-radius:14px;background:var(--field);border:1px solid var(--edge);color:var(--mute);transition:box-shadow .25s}
.srch:focus-within{box-shadow:0 0 0 2px var(--a1)}
.srch input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink)}
.chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:6px 14px;border-radius:99px;background:var(--field);border:1px solid var(--edge);color:var(--mute);transition:all .25s}
.chip.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
.list{flex:1;min-height:0;overflow:auto;list-style:none;margin:0;padding:2px 12px 100px}
.item{position:relative;display:block;width:100%;min-width:0;overflow:hidden;text-align:left;padding:12px 14px 12px 20px;margin-bottom:8px;background:var(--card);border:1px solid var(--edge);border-radius:18px;transition:transform .25s,box-shadow .25s,border-color .25s}
.item::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.item:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.item:active{transform:scale(.98)}
.item.on{border-color:var(--a1);box-shadow:0 0 0 1px var(--a1)}
.item.fresh{animation:up .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*50ms)}
.r1{display:flex;align-items:center;gap:6px;min-width:0}
.r1 b{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.r1 em{display:grid;color:var(--a1)}
.item span,.item small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--mute)}
.item small{font-size:12px;margin-top:2px}
.empty{padding:32px 16px;text-align:center;color:var(--mute)}
.fab{position:absolute;right:20px;bottom:20px;width:58px;height:58px;border-radius:20px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 10px 28px rgba(79,110,255,.5);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.fab:hover{transform:translateY(-3px) rotate(90deg)}
.fab:active{transform:scale(.9)}
.bar{display:flex;align-items:center;gap:8px;padding:14px 16px;overflow-x:auto;scrollbar-width:none}
.bar .sp{flex:1}
.back{display:none}
.sw{display:flex;gap:8px;padding:0 4px}
.dot{flex:none;width:24px;height:24px;border-radius:50%;background:var(--c);border:2px solid transparent;box-shadow:0 0 0 2px transparent;transition:transform .2s,box-shadow .2s}
.dot:hover{transform:scale(1.15)}
.dot.on{box-shadow:0 0 0 2px var(--glass),0 0 0 4px var(--c)}
.ed{display:flex;flex-direction:column;flex:1;min-height:0}
.ed.in{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.title{border:0;background:none;outline:none;width:100%;padding:8px 22px 2px;font-size:30px;font-weight:700;letter-spacing:-.02em}
.meta{display:flex;align-items:center;gap:12px;padding:0 22px 8px;color:var(--mute);font-size:13px}
.pg{flex:1;max-width:160px;height:6px;border-radius:9px;background:var(--field);overflow:hidden}
.pg b{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .45s cubic-bezier(.2,.8,.2,1)}
.body{flex:1;min-height:0;width:100%;resize:none;border:0;background:none;outline:none;padding:8px 22px 24px;line-height:1.7}
.cl{flex:1;min-height:0;overflow:auto;padding:4px 16px 24px}
.row{display:flex;align-items:center;gap:10px;padding:4px 6px;border-radius:12px;animation:up .3s both}
.row:hover{background:var(--field)}
.ck{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:8px;border:2px solid var(--mute);color:#fff;transition:all .25s}
.row.done .ck{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent}
.ci{flex:1;min-width:0;border:0;background:none;outline:none;padding:6px 0;transition:color .25s}
.row.done .ci{color:var(--mute);text-decoration:line-through}
.rm{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:var(--mute);opacity:.5;transition:opacity .2s,color .2s}
.rm:hover{opacity:1;color:#ef4444}
.add{display:flex;align-items:center;gap:8px;margin:6px;padding:8px 10px;border-radius:12px;color:var(--a1);font-weight:500}
.add:hover{background:var(--field)}
.item{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.sheet{position:fixed;inset:0;z-index:20;visibility:hidden;transition:visibility .4s}
.sheet.show{visibility:visible}
.scrim{position:absolute;inset:0;background:rgba(5,10,25,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .35s}
.sheet.show .scrim{opacity:1}
.sc{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 24px));padding:10px;border-radius:26px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--edge);box-shadow:var(--shadow);transform:translate(-50%,120%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sheet.show .sc{transform:translate(-50%,0)}
.sc button[data-a]{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:16px;text-align:left;font-weight:500;transition:background .2s,transform .15s}
.sc button[data-a]:hover{background:var(--field)}
.sc button[data-a]:active{transform:scale(.97)}
.sc .danger{color:#ef4444}
.st{padding:10px 14px 4px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sr{padding:8px 14px 10px}
.none{margin:auto;padding:24px;text-align:center;color:var(--mute)}
.toast{position:fixed;z-index:9;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:16px;padding:12px 18px;border-radius:16px;background:var(--glass);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border:1px solid var(--edge);box-shadow:var(--shadow);transform:translate(-50%,200%);transition:transform .45s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0)}
.toast button{color:var(--a1);font-weight:700}
@media (max-width:720px){
.app{display:block;padding:10px}
.pane{position:absolute;inset:10px;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s,visibility .5s}
.main{transform:translateX(112%);visibility:hidden}
.app.edit .main{transform:none;visibility:visible}
.app.edit .side{transform:translateX(-18%) scale(.95);opacity:0;visibility:hidden}
.back{display:inline-grid}
.title{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

.noanim *{animation:none!important;transition:none!important}.cmp .item{padding-top:8px;padding-bottom:8px}.hide .item span{filter:blur(5px)}
#isl{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translate(-50%,-70px);background:#000;color:#fff;border-radius:99px;padding:6px 16px;font-size:13px;z-index:60;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}#isl.on{transform:translate(-50%,0)}
#adv{display:none;gap:6px;flex-wrap:wrap;padding:0 18px 8px}#adv.on{display:flex}#adv select,.xt input,#ov input,#ov select,#ov textarea{background:var(--field);border:1px solid var(--edge);border-radius:10px;padding:6px 8px;min-width:0}
#qt{padding:0 18px 6px;font-size:12px;color:var(--mute)}#rec{display:flex;gap:6px;padding:0 18px 6px;overflow-x:auto}#rec button{flex:none;background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:4px 10px;font-size:12px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xt{display:flex;flex-direction:column;gap:8px;margin:8px 0}.xt .r{display:flex;gap:6px;flex-wrap:wrap}.xt input{flex:1}.xt .r button,#ov .bt{background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:5px 10px;font-size:13px}.att img{max-width:100%;border-radius:12px;display:block}.att{position:relative}.att .rx{position:absolute;top:4px;right:4px;background:#000a;color:#fff;border-radius:50%;width:24px;height:24px}.mdv{padding:6px 2px}.mdv code{background:var(--field);padding:0 4px;border-radius:4px}
#ov{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:#0006;padding:14px}#ov.on{display:flex}#ov .box{background:var(--bg1);color:var(--ink);border:1px solid var(--edge);border-radius:22px;padding:16px;width:min(460px,100%);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:10px}#ov label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}#ov canvas{width:100%;height:260px;background:#fff;border-radius:12px;touch-action:none}#ov .ac{display:flex;gap:6px;flex-wrap:wrap}
body{font-size:var(--fs,16px)}

#spg{position:fixed;inset:0;z-index:65;display:none;flex-direction:column;background:var(--glass);-webkit-backdrop-filter:blur(40px) saturate(1.6);backdrop-filter:blur(40px) saturate(1.6);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}#spg.on{display:flex;animation:up .3s both}
#spg .sh{display:flex;align-items:center;gap:10px;padding:14px 16px}#spg h2{margin:0;font-size:24px}#spg .sbody{flex:1;overflow:auto;padding:0 14px 20px;display:flex;justify-content:center}
#spg .scard{width:min(560px,100%);align-self:flex-start;background:var(--card);border:1px solid var(--edge);border-radius:24px;padding:6px 18px 14px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);display:flex;flex-direction:column;gap:2px}
#spg label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--edge);font-size:15px}#spg select,#spg textarea{background:var(--field);border:1px solid var(--edge);border-radius:12px;padding:7px 10px;min-width:0}#spg .ac{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}#spg .bt{background:var(--field);border:1px solid var(--edge);border-radius:12px;padding:8px 14px}#spg textarea{width:100%;margin-bottom:8px}#spg small{color:var(--mute);padding-top:6px}#spg input[type=checkbox],#spg input[type=range]{accent-color:var(--a1)}
#ov{background:#0003;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}#ov .box{background:var(--glass);-webkit-backdrop-filter:blur(34px) saturate(1.6);backdrop-filter:blur(34px) saturate(1.6);box-shadow:var(--shadow)}
.xt .r button,.xt input{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="app" id="app">
  <aside class="pane side">
    <div class="top"><h1>Notes</h1><button class="ib" id="theme" aria-label="Switch theme"></button></div>
    <label class="srch"><span id="si"></span><input id="q" type="search" placeholder="Search notes" aria-label="Search notes"></label>
    <div class="chips" id="chips"><button class="chip on" data-f="all">All</button><button class="chip" data-f="pin">Pinned</button><button class="chip" data-f="list">Checklists</button><button class="chip" data-f="arch">Archive</button></div>
    <ul class="list" id="list"></ul>
    <button class="fab" id="new" aria-label="New note"></button>
  </aside>
  <main class="pane main" id="main"></main>
</div>
<div class="sheet" id="sheet"><div class="scrim"></div><div class="sc" id="sc"></div></div>
<div id="spg"></div><div id="isl"></div><div id="ov"><div class="box" id="bx"></div></div><div class="toast" id="toast" role="status"></div>
<script>
(function(){
const COLORS=["#3b82f6","#10b981","#f59e0b","#ef4444","#a855f7"];
const KEY="notes-app-v1";
let notes=[],cur=null,q="",filt="all",mem=null,fresh={},undo=null,tt=null;
const $=id=>document.getElementById(id);
const P={plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="M15 18l-6-6 6-6"/>',pin:'<path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3z"/>',list:'<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',check:'<path d="M5 12l5 5 9-10"/>',box:'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'};
const ic=(n,s)=>`<svg viewBox="0 0 24 24" width="${s||20}" height="${s||20}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const get=id=>notes.find(n=>n.id===id);
const done=n=>n.items.filter(i=>i.d).length;
const isEmpty=n=>!n.title.trim()&&!n.body.trim()&&!n.items.some(i=>i.t.trim());
function fmt(t){const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):d.toLocaleDateString([],{month:"short",day:"numeric"})}
function load(){try{const r=localStorage.getItem(KEY);if(r)notes=JSON.parse(r)||[]}catch(e){notes=mem||[]}notes.forEach(n=>{n.items=n.items||[];n.type=n.type||"text";n.body=n.body||"";n.title=n.title||""});notes=notes.filter(n=>!isEmpty(n))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){mem=notes}}
function preview(n){if(n.type==="list")return n.items.length?done(n)+" of "+n.items.length+" done":"Empty checklist";return n.body.replace(/\s+/g," ").trim().slice(0,90)||"No text yet"}
function shown(){const s=q.trim().toLowerCase();return notes.filter(n=>!!n.arch===(filt==="arch")&&(filt==="all"||filt==="arch"||(filt==="pin"&&n.pin)||(filt==="list"&&n.type==="list"))&&(!s||(n.title+" "+n.body+" "+n.items.map(i=>i.t).join(" ")).toLowerCase().includes(s))).sort((a,b)=>(b.pin-a.pin)||(b.t-a.t))}
function renderList(){const l=shown();$("list").innerHTML=l.length?l.map((n,i)=>`<li><button class="item${n.id===cur?" on":""}${fresh[n.id]?" fresh":""}" data-id="${n.id}" style="--c:${n.c};--i:${i}"><div class="r1"><b>${esc(n.title||"Untitled")}</b>${n.pin?`<em>${ic("pin",14)}</em>`:""}</div><span>${esc(preview(n))}</span><small>${fmt(n.t)}${n.type==="list"?" · Checklist":""}</small></button></li>`).join(""):`<li class="empty">${q||filt!=="all"?"Nothing matches yet.":"No notes yet. Tap + to write your first one."}</li>`;fresh={}}
function meta(){const n=get(cur),e=$("meta");if(!n||!e)return;if(n.type==="list"){const p=n.items.length?Math.round(done(n)/n.items.length*100):0;e.innerHTML=`<span>${done(n)} of ${n.items.length} done</span><i class="pg"><b style="width:${p}%"></b></i>`}else{const w=n.body.trim()?n.body.trim().split(/\s+/).length:0;e.innerHTML=`<span>${w} words · Edited ${fmt(n.t)}</span>`}}
function items(f){const n=get(cur),c=$("cl");if(!c)return;c.innerHTML=n.items.map(i=>`<div class="row${i.d?" done":""}" data-i="${i.id}"><button class="ck" aria-label="Mark done">${i.d?ic("check",16):""}</button><input class="ci" value="${esc(i.t)}" placeholder="List item" aria-label="List item"><button class="rm" aria-label="Remove item">${ic("x",16)}</button></div>`).join("")+`<button class="add" id="add">${ic("plus",16)} Add item</button>`;if(f){const e=c.querySelector(`[data-i="${f}"] .ci`);if(e)e.focus()}}
function renderMain(anim){const n=get(cur),m=$("main");$("app").classList.toggle("edit",!!n);

function spc(){$("spg").classList.remove("on")}
$("gear").onclick=()=>{const o=(a,v)=>a.map(x=>`<option value="${x[0]}"${String(x[0])===String(v)?" selected":""}>${x[1]}</option>`).join("");
spg(`<label>Theme<select data-k="th">${o([["system","System"],["light","Light"],["dark","Dark"]],S.th)}</select></label><label>Accent<select data-k="ac" data-n>${o(AC.map((a,i)=>[i,["Blue","Green","Amber","Violet","Slate"][i]]),S.ac)}</select></label><label>Font<select data-k="ff">${o([["Figtree","Default"],["Georgia","Serif"],["ui-monospace","Mono"]],S.ff)}</select></label><label>Font size<input type="range" min="13" max="22" data-k="fs" data-n value="${S.fs}"></label><label>Language<select data-k="lg">${o([["en","English"],["km","ខ្មែរ"]],S.lg)}</select></label><label>Compact mode<input type="checkbox" data-k="cp" ${S.cp?"checked":""}></label><label>Animations<input type="checkbox" data-k="an" ${S.an?"checked":""}></label><label>Default note type<select data-k="dt">${o([["text","Text"],["list","Checklist"]],S.dt)}</select></label><label>Auto-save snapshot (sec)<select data-k="as" data-n>${o([[10,10],[30,30],[60,60],[300,300]],S.as)}</select></label><label>Notifications<input type="checkbox" data-k="nt" ${S.nt?"checked":""}></label><label>Hide previews (privacy)<input type="checkbox" data-k="hd" ${S.hd?"checked":""}></label>
<label>Storage<span>${Math.round(JSON.stringify(notes).length/1024)} KB · ${trash.length} in trash</span></label><div class="ac"><button class="bt" data-a="et">Empty trash</button><button class="bt" data-a="bk">Copy backup</button><button class="bt" data-a="rs">Restore backup</button></div><textarea id="bkt" rows="3" placeholder="Paste a backup here to restore" hidden></textarea><small>Notes, version 1.0. Data stays on this device.</small>`);
$("spg").onchange=e=>{const k=e.target.dataset.k;if(!k)return;let v=e.target.type==="checkbox"?+e.target.checked:e.target.dataset.n!==undefined?+e.target.value:e.target.value;S[k]=v;if(k==="nt"&&v&&window.Notification)Notification.requestPermission();ap();renderList()};
$("spg").oninput=e=>{if(e.target.dataset.k==="fs"){S.fs=+e.target.value;ap()}};
$("spg").onclick=e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.a;if(a==="x")spc();else if(a==="et"){trash=[];save();renderList();toast("Trash emptied")}
else if(a==="bk"){try{navigator.clipboard.writeText(JSON.stringify({notes,trash}));toast("Backup copied")}catch(er){toast("Couldn't copy")}}
else if(a==="rs"){const t=$("bkt");if(t.hidden){t.hidden=false;return}try{const d=JSON.parse(t.value);notes=d.notes||[];trash=d.trash||[];save();renderList();renderMain();spc();toast("Backup restored")}catch(er){toast("That backup isn't valid")}}}};
const qc=document.createElement("button");qc.className="ib";qc.id="qc";qc.setAttribute("aria-label","Quick capture");qc.innerHTML=ic("bolt",22);qc.style.cssText="position:absolute;left:18px;bottom:18px;width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--edge);z-index:3";document.querySelector(".side").appendChild(qc);
qc.onclick=()=>{ov('<b>Quick capture</b><textarea id="qb" rows="5" placeholder="Jot it down"></textarea><div class="ac"><button class="bt" data-q="ok">Save note</button><button class="bt" data-q="x">Cancel</button></div>');setTimeout(()=>$("qb").focus(),50);$("bx").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.q==="ok"&&$("qb").value.trim()){const v=$("qb").value.trim(),l=v.split("\n");const n={id:uid(),title:l[0].slice(0,40),body:l.slice(1).join("\n")||v,items:[],type:"text",pin:0,c:COLORS[0],t:Date.now(),c0:Date.now()};notes.unshift(n);save();renderList();toast("Captured")}ovx()}};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){ovx();spc()}});
prev=notes.slice();ap();

renderList();renderMain();
})();
</script>
</body>
</html>
